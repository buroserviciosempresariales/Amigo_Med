  <!-- Antenna -->
  <line x1="32" y1="12" x2="32" y2="18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="11" r="3" fill="#10B981" />
  <!-- Eyes -->
  <circle cx="26" cy="27" r="3.5" fill="#0284C7" />
  <circle cx="38" cy="27" r="3.5" fill="#0284C7" />
  <!-- Smile -->
